name: "CodeQL"

on:
  push:
    branches: [ "master" ]
#  schedule:
#    - cron: '00 07 * * 0' # Weekly on Sunday at 07:00 UTC

jobs:
  analyze:
    name: Analyze
    runs-on: macos-26
    # Push-only analysis. SARIF upload needs security-events.
    # contents and actions stay read-only so checkout and the CodeQL
    # bundle download work. This file never opens a pull request or
    # writes a check run.
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'swift' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 (v6.1.0, resolved 2026-11-20)
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4 (v4.39.4, resolved 2026-11-20)
        with:
          languages: ${{ matrix.language }}
          config-file: .github/codeql/codeql-config.yml

      - name: Set up Xcode Developer Directory
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Reset and List Simulators
        run: |
          xcrun simctl shutdown all
          xcrun simctl erase all
          xcrun simctl list

      - name: Build with Xcode
        run: |
          xcodebuild -scheme "Lutheran Radio" \
            -destination 'platform=iOS Simulator,OS=26.5,name=iPad (A16)' \
            clean build
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

#      - name: Run Tests with Xcode
#        run: |
#          xcodebuild -scheme "Lutheran Radio" \
#            -destination 'platform=iOS Simulator,OS=26.5,name=iPad (A16)' \
#            clean test | xcpretty
#        env:
#          DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4 (v4.39.4, resolved 2026-11-20)
        with:
          output: results.sarif
